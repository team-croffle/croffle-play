# Platform stack. PostgreSQL and S3 storage are external: on the server, the existing PostgreSQL
# and MinIO AIStor (DATABASE_URL / LOGTO_DB_URL / PG_HOST, S3_ENDPOINT / STORAGE_UPSTREAM /
# BACKUP_S3_ENDPOINT), with API_IMAGE / SHELL_IMAGE / ROOMS_IMAGE set to GHCR tags.
#   cp infra/.env.example infra/.env   # then edit
#   docker compose -f infra/compose.yml --env-file infra/.env up -d
# Locally, compose.local.yml adds a bundled PostgreSQL and S3 store; the defaults below point at it:
#   docker compose -f infra/compose.yml -f infra/compose.local.yml --env-file infra/.env up --build

name: croffle-play

services:
  # Identity provider (OIDC). Players sign in here; only the shell holds their tokens.
  logto:
    image: svhd/logto:1
    restart: unless-stopped
    entrypoint: ['sh', '-c', 'npm run cli db seed -- --swe && npm start']
    environment:
      TRUST_PROXY_HEADER: 1
      DB_URL: ${LOGTO_DB_URL:-postgres://${POSTGRES_USER:-play}:${POSTGRES_PASSWORD:-}@postgres:5432/logto}
      ENDPOINT: ${LOGTO_ENDPOINT:-https://auth.play.croffledev.kr}
      ADMIN_ENDPOINT: ${LOGTO_ADMIN_ENDPOINT:-http://localhost:3302}
    ports:
      - '127.0.0.1:3301:3001'
      # Admin console: reach it through an SSH tunnel, never publicly.
      - '127.0.0.1:3302:3002'
    networks: [platform-net, data-net]

  # Game domain + adapter host in front of storage (infra/nginx/templates).
  games-edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    tmpfs: [/etc/nginx/conf.d, /var/cache/nginx, /var/run]
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:-croffle-play.link}
      GAME_DOMAIN_REGEX: ${GAME_DOMAIN_REGEX:-croffle-play\.link}
      STATIC_HOST: ${STATIC_HOST:-static.play.croffledev.kr}
      PLATFORM_ORIGIN: ${PLATFORM_ORIGIN:-https://play.croffledev.kr}
      ROOMS_ORIGIN: ${ROOMS_ORIGIN:-wss://rooms.play.croffledev.kr}
      # host:port of the S3 API, plain HTTP inside the network.
      STORAGE_UPSTREAM: ${STORAGE_UPSTREAM:-minio:9000}
      NGINX_RESOLVER: 127.0.0.11
      NGINX_ENVSUBST_FILTER: '^(GAME_DOMAIN|GAME_DOMAIN_REGEX|STATIC_HOST|PLATFORM_ORIGIN|ROOMS_ORIGIN|STORAGE_UPSTREAM|NGINX_RESOLVER)$'
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    ports:
      - '127.0.0.1:8080:8080'
    networks: [storage-net]

  api:
    image: ${API_IMAGE:-croffle-play/api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-play}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-play}}
      DB_SEED: ${DB_SEED:-false}
      GAME_URL_TEMPLATE: ${GAME_URL_TEMPLATE:-https://{id}.croffle-play.link/{version}/}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # Host in presigned upload URLs; must be reachable from CI runners.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-play-api}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_BUCKET: games
      OIDC_ISSUER: ${OIDC_ISSUER:-https://auth.play.croffledev.kr/oidc}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-https://api.play.croffledev.kr}
      # Fetch signing keys inside the network; tokens still carry the public issuer.
      OIDC_JWKS_URL: http://logto:3001/oidc/jwks
      ADMIN_SUBS: ${ADMIN_SUBS:-}
      # Game tokens (rooms, game servers): ES256 PKCS8 PEM, `\n`-escaped on one line.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-https://api.play.croffledev.kr}
      GITHUB_NOTIFY_TOKEN: ${GITHUB_NOTIFY_TOKEN:-}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - '127.0.0.1:3001:3001'
    networks: [platform-net, data-net, storage-net]

  # Shared multiplayer relay. Verifies game tokens against the API's JWKS; no database.
  rooms:
    image: ${ROOMS_IMAGE:-croffle-play/rooms:local}
    build:
      context: ..
      dockerfile: apps/rooms/Dockerfile
    restart: unless-stopped
    read_only: true
    environment:
      JWKS_URL: http://api:3001/.well-known/jwks.json
      TOKEN_ISSUER: ${PUBLIC_API_ORIGIN:-https://api.play.croffledev.kr}
      ALLOWED_ORIGIN_TEMPLATE: https://{id}.${GAME_DOMAIN:-croffle-play.link}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:3002:3002'
    networks: [platform-net]

  shell:
    image: ${SHELL_IMAGE:-croffle-play/shell:local}
    build:
      context: ..
      dockerfile: apps/shell/Dockerfile
    restart: unless-stopped
    environment:
      NUXT_API_BASE: http://api:3001
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?set NUXT_SESSION_PASSWORD}
      NUXT_SITE_URL: ${SITE_URL:-https://play.croffledev.kr}
      NUXT_OIDC_ISSUER: ${OIDC_ISSUER:-https://auth.play.croffledev.kr/oidc}
      NUXT_OIDC_AUDIENCE: ${OIDC_AUDIENCE:-https://api.play.croffledev.kr}
      NUXT_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      NUXT_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      NUXT_ROOMS_URL: ${ROOMS_URL:-wss://rooms.play.croffledev.kr}
      NUXT_CSP_FRAME_SRC: ${NUXT_CSP_FRAME_SRC:-https://*.croffle-play.link}
      NUXT_CSP_CONNECT_SRC: ${NUXT_CSP_CONNECT_SRC:-https://static.play.croffledev.kr}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    networks: [platform-net]

  # Nightly backups and the health watcher (infra/ops). Writes to BACKUP_PATH on the host.
  ops:
    build: ./ops
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-play}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-play}
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-http://minio:9000}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-play-backup}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      HEALTH_URLS: ${HEALTH_URLS:-http://api:3001/healthz http://shell:3000/ http://rooms:3002/healthz http://games-edge:8080/healthz http://logto:3001/api/status}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
    networks: [platform-net, data-net, storage-net]

networks:
  # Platform services talk to each other here.
  platform-net:
  # Database: API only. Game servers never join this network.
  data-net:
  # Object storage: API and the game-domain edge only.
  storage-net:
  # Tier 2 game servers (untrusted tenants) and the reverse proxy in front of them. Nothing
  # else joins it: game servers reach the platform through its public API only.
  games-net:
    name: games-net
