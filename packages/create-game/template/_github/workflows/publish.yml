# Publish a version to Croffle Play when a tag `vX.Y.Z` is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# Needs: repository variable CROFFLE_PLAY_API and secret CROFFLE_PLAY_DEPLOY_KEY
# (ask a platform admin for the game's deploy key).
name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          GAME_VERSION: ${{ github.ref_name }}
      - name: Publish
        run: pnpm exec play-cli publish dist
        env:
          CROFFLE_PLAY_API: ${{ vars.CROFFLE_PLAY_API }}
          CROFFLE_PLAY_DEPLOY_KEY: ${{ secrets.CROFFLE_PLAY_DEPLOY_KEY }}
