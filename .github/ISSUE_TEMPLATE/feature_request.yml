name: Feature Request
description: Propose a platform or SDK feature.
title: '[FEAT]: '
labels: ['feature']
type: feature
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Shell
        - API
        - SDK / protocol
        - CLI / publish
        - Rooms (multiplayer)
        - Admin
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What a game author or player cannot do today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Suggested behaviour. For SDK changes, say whether it is additive (a new capability) or breaking.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
