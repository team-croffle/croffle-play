# Release — one container image per app to GHCR + draft GitHub Release.
#
# Version source of truth is the git tag (`vX.Y.Z[-rc.N]`); nothing in the
# tree is bumped, so there is no bot commit on master. Each app's Dockerfile
# receives the version through the `VERSION` build arg.
#
# Trigger (from master only):
#   gh workflow run release.yml --ref master -f version=0.1.0-rc.1 [-f dry_run=true]
#
#   - version: exact semver without `v`. `X.Y.Z-rc.N` = pre-release,
#              `X.Y.Z` = stable (moves `latest` and `X.Y`).
#   - dry_run: build the images only — no push, no tag, no release.
#
# Images: ghcr.io/<owner>/<repo>/<app>:<version> for every apps/<app>/Dockerfile.
# Assets: adapters-v<N>-<version>.tar.gz (+ .sha256) per SDK major — the host
# adapter bundles an admin registers with the api image (docs/guide/admin.md).
# Order: validate → gate → build/push images + adapter bundles → tag + draft release.
# Release notes are filled in afterwards with `gh release edit --notes-file`.
#
# Not here: npm packages (`Publish Packages` workflow via Changesets) and
# uploading adapters to storage (an admin runs `register-cli` from the api image).

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version without leading v (e.g. 0.1.0-rc.1 or 0.1.0)
        required: true
        type: string
      dry_run:
        description: Build the images only (no push, tag, or release)
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      minor: ${{ steps.calc.outputs.minor }}
      is_prerelease: ${{ steps.calc.outputs.is_prerelease }}
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: calc
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Run releases from master (got $GITHUB_REF)."
            exit 1
          fi

          V="${INPUT_VERSION#v}"
          if [[ ! "$V" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-rc\.([0-9]+))?$ ]]; then
            echo "::error::Version must be X.Y.Z or X.Y.Z-rc.N (got $INPUT_VERSION)."
            exit 1
          fi
          MINOR="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          IS_PRE=false
          [[ -n "${BASH_REMATCH[4]}" ]] && IS_PRE=true
          TAG="v$V"

          # Sort key: stable sorts after every rc of the same core.
          key() {
            [[ "$1" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)(-rc\.([0-9]+))?$ ]] || return 1
            printf '%06d.%06d.%06d.%06d\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}" \
              "$([[ -n "${BASH_REMATCH[5]}" ]] && echo "${BASH_REMATCH[5]}" || echo 999999)"
          }

          LATEST=""
          for t in $(git tag --list 'v*'); do
            k=$(key "$t") || continue
            if [[ -z "$LATEST" || "$k" > "$(key "$LATEST")" ]]; then LATEST="$t"; fi
          done
          echo "Latest tag: ${LATEST:-<none>}"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          if [[ -n "$LATEST" && ! "$(key "$TAG")" > "$(key "$LATEST")" ]]; then
            echo "::error::$TAG is not newer than $LATEST."
            exit 1
          fi
          if [[ "$IS_PRE" == "false" ]] && ! git tag --list "v$V-rc.*" | grep -q .; then
            echo "::warning::Stable $TAG has no rc before it."
          fi

          echo "Resolved $TAG (prerelease=$IS_PRE, dry_run=$DRY_RUN)"
          {
            echo "version=$V"
            echo "tag=$TAG"
            echo "minor=$MINOR"
            echo "is_prerelease=$IS_PRE"
          } >> "$GITHUB_OUTPUT"

      - id: apps
        name: Find apps with a Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(ls apps/*/Dockerfile 2>/dev/null | sed -E 's#^apps/([^/]+)/Dockerfile$#\1#' | jq -R . | jq -cs .)
          if [[ "$JSON" == "[]" ]]; then
            echo "::error::No apps/*/Dockerfile found; nothing to release."
            exit 1
          fi
          echo "apps=$JSON" >> "$GITHUB_OUTPUT"
          echo "Apps: $JSON"

  check:
    name: Gate (lefthook check)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec lefthook run check

  image:
    name: Build and push (${{ matrix.app }})
    needs: [resolve, check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: ${{ fromJSON(needs.resolve.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=${{ needs.resolve.outputs.minor }},enable=${{ needs.resolve.outputs.is_prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.is_prerelease == 'false' }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ !inputs.dry_run }}
          build-args: VERSION=${{ needs.resolve.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Record digest
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          APP: ${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s %s\n' "$APP" "$DIGEST" > "digests/$APP.txt"

      - if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.app }}
          path: digests/*.txt
          retention-days: 1

  adapters:
    name: Adapter bundles
    needs: [resolve, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @croffledev/play-adapters...

      - name: Build
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: pnpm --filter @croffledev/play-adapters build

      # One archive per major, unpacking to v<N>/<version>/{index.js,manifest.json}.
      - name: Pack
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p assets
          cd apps/adapters/dist
          for dir in v*/"$VERSION"; do
            major="${dir%%/*}"
            name="adapters-$major-$VERSION.tar.gz"
            tar -czf "../../../assets/$name" "$dir"
            (cd ../../../assets && sha256sum "$name" > "$name.sha256")
          done
          ls -l ../../../assets
          [[ -n "$(ls ../../../assets)" ]] || { echo "::error::no adapter bundles for $VERSION"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: adapters
          path: assets/*
          retention-days: ${{ inputs.dry_run && 1 || 7 }}

  release:
    name: Tag and draft release
    needs: [resolve, image, adapters]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: adapters
          path: assets

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          IS_PRE: ${{ needs.resolve.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$IS_PRE" == "true" ]]; then
            TITLE="Pre-Release $TAG"
          else
            TITLE="Release $TAG"
          fi
          NOTES="Images:"$'\n'
          while read -r app digest; do
            NOTES+=$(printf -- '- `%s/%s:%s` — `%s`' "$REPO" "$app" "$VERSION" "$digest")$'\n'
          done < <(cat digests/*.txt)
          NOTES+=$'\n'"Host adapter bundles (register with the api image, see docs/guide/admin.md):"$'\n'
          for f in assets/*.tar.gz; do
            NOTES+="- \`${f#assets/}\`"$'\n'
          done
          ARGS=(--draft --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA")
          [[ "$IS_PRE" == "true" ]] && ARGS+=(--prerelease)
          gh release create "$TAG" assets/* "${ARGS[@]}" --repo "$GITHUB_REPOSITORY"
          echo "Draft $TAG created at $GITHUB_SHA"
