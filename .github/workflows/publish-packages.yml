# Publish Packages — Changesets for packages/* (protocol, sdk, cli, create-game).
# On master: opens/updates the "chore: version packages" PR, or publishes to
# npm when that PR is merged. apps/* are private and never versioned here.
#
# npm auth is trusted publishing (OIDC) only. Each package on npmjs.com trusts
# team-croffle/croffle-play + this workflow file name; no npm token exists in
# this repository and none may be added.

name: Publish Packages

on:
  push:
    branches: [master]
    paths:
      - '.changeset/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/publish-packages.mjs'
      - '.github/workflows/publish-packages.yml'
  workflow_dispatch:

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update the version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (OIDC)
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm run release
