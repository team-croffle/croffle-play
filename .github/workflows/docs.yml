# Docs — builds docs/ with VitePress and publishes it to GitHub Pages.
#
# Runs on master when docs/ changes (and by hand). Deploys with the Pages OIDC
# token: no secrets. The site lives at https://team-croffle.github.io/croffle-play/
# until a custom domain is set (then set the DOCS_BASE variable to `/`).
# Pull requests build the site in CI (`pnpm build`), so a broken page or dead
# link fails there first.

name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # last-updated dates come from git history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @croffledev/play-docs
      - name: Build
        env:
          DOCS_BASE: ${{ vars.DOCS_BASE || '/croffle-play/' }}
        run: pnpm --filter @croffledev/play-docs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
